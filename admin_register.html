<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Register — PlacementHub</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-left">
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>
    <div class="auth-brand">
      <div class="logo-icon">🏢</div>
      <h1>Admin Portal</h1>
      <p>Manage placements with ease</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form-box">
      <h2>Admin Registration</h2>
      <p class="subtitle">Create an admin account</p>
      
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Admin name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="admin@college.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a strong password">
      </div>
      
      <button class="btn btn-primary" onclick="register()">Create Admin Account →</button>
      
      <div class="auth-link">
        Already have an account? <a href="/admin/login">Login</a>
      </div>
      <div class="auth-link" style="margin-top:8px">
        <a href="/">← Back to home</a>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
async function register() {
  const data = { name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value };
  if (!data.name || !data.email || !data.password) return showToast('Please fill all fields', 'error');
  const res = await fetch('/api/admin/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  const json = await res.json();
  showToast(json.message, json.success ? 'success' : 'error');
  if (json.success) setTimeout(() => window.location = '/admin/login', 1500);
}
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = (type === 'success' ? '✓ ' : '✗ ') + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
