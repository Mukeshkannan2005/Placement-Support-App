<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — PlacementHub</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-left">
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>
    <div class="auth-brand">
      <div class="logo-icon">🎓</div>
      <h1>Welcome Back</h1>
      <p>Your next opportunity awaits</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form-box">
      <h2>Student Login</h2>
      <p class="subtitle">Sign in to your account</p>
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="student@college.edu">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">
      </div>
      
      <button class="btn btn-primary" onclick="login()">Sign In →</button>
      
      <div class="auth-link">
        New student? <a href="/student/register">Create account</a>
      </div>
      <div class="auth-link" style="margin-top:8px">
        <a href="/">← Back to home</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function login() {
  const data = { email: document.getElementById('email').value, password: document.getElementById('password').value };
  if (!data.email || !data.password) return showToast('Please fill all fields', 'error');
  const res = await fetch('/api/student/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  const json = await res.json();
  if (json.success) { showToast('Login successful!', 'success'); setTimeout(() => window.location = '/student/home', 800); }
  else showToast(json.message, 'error');
}
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = (type === 'success' ? '✓ ' : '✗ ') + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
